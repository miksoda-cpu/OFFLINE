<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<rect width="800" height="600" fill="#f6f4ef"/><g transform="translate(560,360)"><rect x="0" y="0" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><rect x="44" y="0" width="42" height="42" fill="#1c1b19" stroke="#b9c7ce"/><rect x="88" y="0" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><rect x="132" y="0" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><rect x="0" y="44" width="42" height="42" fill="#ffffff" stroke="#b9c7ce"/><rect x="44" y="44" width="42" height="42" fill="#ffffff" stroke="#b9c7ce"/><rect x="88" y="44" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><rect x="132" y="44" width="42" height="42" fill="#ffffff" stroke="#b9c7ce"/><rect x="0" y="88" width="42" height="42" fill="#ffffff" stroke="#b9c7ce"/><rect x="44" y="88" width="42" height="42" fill="#ffffff" stroke="#b9c7ce"/><rect x="88" y="88" width="42" height="42" fill="#ffffff" stroke="#b9c7ce"/><rect x="132" y="88" width="42" height="42" fill="#1c1b19" stroke="#b9c7ce"/><rect x="0" y="132" width="42" height="42" fill="#1c1b19" stroke="#b9c7ce"/><rect x="44" y="132" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><rect x="88" y="132" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><rect x="132" y="132" width="42" height="42" fill="#f1e6c9" stroke="#b9c7ce"/><circle cx="109" cy="21" r="12" fill="#8a5a00"/><circle cx="21" cy="21" r="0"/></g>
<text x="40" y="80" font-size="18" letter-spacing="3" fill="#5f5b53" font-family="system-ui, sans-serif">OFFLINE · PAUSE</text>
<text x="40" y="140" font-size="48" font-weight="700" fill="#1c1b19" font-family="Alegreya, Georgia, serif">Ein Rätsel für zwischendurch</text><text x="40" y="200" font-size="28" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Kurz weg vom Alltag, ganz bei einer Sache.</text><text x="40" y="246" font-size="28" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Jeden Tag ein neues Rätsel, für alle dasselbe,</text><text x="40" y="292" font-size="28" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">auch ohne Netz. Leicht, mittel oder schwer,</text><text x="40" y="338" font-size="28" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Pause stellt sich auf dich ein.</text>
<rect x="40" y="560" width="120" height="6" rx="3" fill="#c8102e"/></svg>
