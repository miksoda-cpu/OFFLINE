<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"><rect width="800" height="600" fill="#eef3f6"/><text x="40" y="80" font-size="18" font-weight="400" fill="#3e5866" font-family="Atkinson Hyperlegible, system-ui, sans-serif">OFFLINE · WAS DIE LUMIS DENKEN</text><text x="40" y="150" font-size="44" font-weight="300" fill="#1c1b19" font-family="Iowan Old Style, Georgia, serif">Klein und ohne Netz</text><text x="40" y="215" font-size="28" font-weight="400" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Rund 1,8 MB mit allen fünfzehn Bildern.</text><text x="40" y="261" font-size="28" font-weight="400" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Alles liegt auf dem Gerät. Vorlesen und</text><text x="40" y="307" font-size="28" font-weight="400" fill="#1c1b19" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Anhören mit der Stimme des Geräts.</text><rect x="40" y="560" width="120" height="2" rx="1" fill="#3e5866"/></svg>