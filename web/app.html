<!doctype html>
<html lang="de-AT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFFLINE – Kommandozentrale</title>
  <meta name="description" content="Prototyp der OFFLINE-App: Notrufe, Blackout-Vorsorge, Bibliothek, Karte Österreich, Update-Abo.">
  <meta name="theme-color" content="#c8102e">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="proto-banner">Prototyp – so wird die Desktop-App aussehen. <a href="/">Zur Übersicht</a></div>
  <div class="topbar">
    <a class="brand" href="#start"><span class="brand-flag" aria-hidden="true"></span>OFFLINE</a>
    <button class="btn btn-sm menu-btn" id="menu" aria-controls="sidebar" aria-expanded="false">Menü</button>
  </div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#start"><span class="brand-flag" aria-hidden="true"></span>OFFLINE</a>
      <nav class="nav" id="nav"></nav>
      <div id="download" class="download" hidden></div>
      <div class="status">
        <div class="status-zeile"><span class="dot" id="net-dot"></span><span id="net-text">…</span>
          <button class="neu" id="net-neu" type="button" title="Verbindung und Katalog neu laden" aria-label="Neu laden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button></div>
        <div class="status-zeile mono" id="app-info" style="font-size:.75rem">…</div>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
