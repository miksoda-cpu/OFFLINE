[package]
name = "offline-app"
version = "0.7.2"
description = "OFFLINE – Wissen, das nicht ausfällt"
authors = ["The Digioneer / digitalworld Academy"]
edition = "2021"

[lib]
name = "offline_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
# Der Updater braucht TLS (reqwest/rustls) – wie der Kern nur mit dem Feature tls, damit die Typprüfung ohne C-Compiler geht
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
offline-kern = { path = "../../kern", default-features = false }

[features]
default = ["tls", "updater"]
# Netz mit TLS (Pakete, Katalog) – ohne es geht nur die Typprüfung ohne C-Compiler
tls = ["offline-kern/tls"]
# Eigener App-Updater (latest.json auf Hetzner) – nur im Direkt-Download
updater = ["tls", "dep:tauri-plugin-updater"]
# Store-Build (0.7.2, Startreife): ohne eigenen Updater und ohne internen Kanal; die Stores aktualisieren selbst.
# Bauen: npx tauri build --no-default-features --features store --config src-tauri/tauri.store.conf.json
store = ["tls"]

[dev-dependencies]
# Mock-Laufzeit für den Berechtigungstest (IPC-Anfragen mit der Adresse des Modulservers)
tauri = { version = "2.11", features = ["test"] }
