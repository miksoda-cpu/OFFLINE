[package]
name = "offline-app"
version = "0.1.2"
description = "OFFLINE – Wissen, das nicht ausfällt"
authors = ["The Digioneer / digitalworld Academy"]
edition = "2021"

[lib]
name = "offline_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
# Der Updater braucht TLS (reqwest/rustls) – wie der Kern nur mit dem Feature tls, damit die Typprüfung ohne C-Compiler geht
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
offline-kern = { path = "../../kern", default-features = false }

[features]
default = ["tls"]
tls = ["offline-kern/tls", "dep:tauri-plugin-updater"]
