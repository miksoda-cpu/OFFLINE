# Nur lesen (0.7.2, Startreife): Was protokolliert der Paket-Speicher bei Hetzner? Für die Datenschutz-Angaben der Stores.
# Ändert nichts am Bucket. Start: gh workflow run bucket-pruefen.yml
name: Bucket prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Protokollierung, Lebenszyklus, Freigaben
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          a() { echo "== $*"; aws s3api "$@" --bucket "$BUCKET" --endpoint-url "$ENDPOINT" 2>&1 | sed 's/^/   /' || true; }
          a get-bucket-logging
          a get-bucket-lifecycle-configuration
          a get-bucket-policy
          a get-bucket-cors
          a get-bucket-versioning
          echo "== Ordner oben im Bucket"
          aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" | sed 's/^/   /'
          echo "== Andere Buckets mit diesen Zugangsdaten (Ziel möglicher Protokolle)"
          aws s3api list-buckets --endpoint-url "$ENDPOINT" --query 'Buckets[].Name' --output text | sed 's/^/   /'
