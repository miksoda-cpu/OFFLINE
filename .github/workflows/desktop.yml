# Baut die OFFLINE-Desktop-App für Windows, macOS (Intel + Apple Silicon) und Linux.
# Läuft nur auf Knopfdruck („Run workflow“) und bei Tags v* – nicht bei jedem Push, weil macOS-Builds das
# Minutenkontingent privater Repositories zehnfach belasten. Die Installer liegen danach unter
# „Actions → Lauf → Artifacts“ (bzw. bei Tags als GitHub-Release-Entwurf); mit „Veröffentlichen“ zusätzlich auf Hetzner.
name: Desktop-App

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Nach dem Bauen als App-Update veröffentlichen (Installer nach Hetzner, latest.json schreiben)"
        type: boolean
        default: false

jobs:
  kern:
    name: Kern-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: node --test werkzeug/test.mjs
      - run: cargo test --manifest-path kern/Cargo.toml

  bauen:
    name: ${{ matrix.name }}
    needs: kern
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            plattform: windows-x86_64
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            plattform: darwin-aarch64
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            plattform: darwin-x86_64
          - name: Linux
            os: ubuntu-22.04
            args: ""
            plattform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: kiwix-serve als mitgeliefertes Programm holen
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            Windows)               paket=kiwix-tools_win-x86_64.zip;   alt=kiwix-tools_win-i686.zip; triple=x86_64-pc-windows-msvc; ext=.exe ;;
            "macOS Apple Silicon") paket=kiwix-tools_macos-arm64.tar.gz;  alt=""; triple=aarch64-apple-darwin; ext="" ;;
            "macOS Intel")         paket=kiwix-tools_macos-x86_64.tar.gz; alt=""; triple=x86_64-apple-darwin;  ext="" ;;
            Linux)                 paket=kiwix-tools_linux-x86_64.tar.gz; alt=""; triple=x86_64-unknown-linux-gnu; ext="" ;;
          esac
          basis=https://download.kiwix.org/release/kiwix-tools
          mkdir -p app/src-tauri/binaries kiwix && cd kiwix
          # Windows-curl (schannel) bricht ab, wenn der Sperrlisten-Server nicht antwortet – daher best-effort + Wiederholungen
          extra=""; [ "${{ runner.os }}" = "Windows" ] && extra="--ssl-no-revoke"
          holen() { curl -fsSL $extra --retry 3 --retry-delay 10 --retry-all-errors -o paket "$1"; }
          if ! holen "$basis/$paket"; then
            [ -n "$alt" ] && holen "$basis/$alt"
          fi
          case "$paket" in *.zip) unzip -q paket ;; *) tar xzf paket ;; esac
          bin=$(find . -type f \( -name "kiwix-serve" -o -name "kiwix-serve.exe" \) | head -1)
          [ -n "$bin" ] || { echo "kiwix-serve nicht gefunden"; exit 1; }
          cp "$bin" "../app/src-tauri/binaries/kiwix-serve-$triple$ext"
          chmod +x "../app/src-tauri/binaries/kiwix-serve-$triple$ext"
          ls -la ../app/src-tauri/binaries
      - run: npm install
        working-directory: app
      - name: Updater-Signatur vorbereiten
        id: updater
        shell: bash
        env:
          SCHLUESSEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Ohne Signaturschlüssel baut Tauri keine Updater-Dateien (sonst bricht der Build ab) – Installer entstehen trotzdem
          if [ -n "$SCHLUESSEL" ]; then
            echo "aktiv=ja" >> "$GITHUB_OUTPUT"; echo "args=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – App-Update-Dateien werden nicht erzeugt"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > app/updater-aus.json
            echo "aktiv=nein" >> "$GITHUB_OUTPUT"; echo "args=${{ matrix.args }} --config updater-aus.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: ${{ steps.updater.outputs.args }}
          # Bei Tags v* entsteht ein Release-Entwurf mit allen Installern
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('OFFLINE {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: true
      - name: "macOS: Sidecar und Bundle ad-hoc signieren, prüfen, DMG bauen"
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=$(find app/src-tauri/target -type d -path "*/release/bundle/macos/*.app" | head -1)
          [ -n "$app" ] || { echo ".app nicht gefunden"; exit 1; }
          echo "Bundle: $app"
          # 1) mitgelieferte Programme und Hauptprogramm einzeln ad-hoc signieren (zuerst kiwix-serve)
          for b in "$app/Contents/MacOS/"*; do
            echo "signiere $b"; codesign --force --timestamp=none -s - "$b"
          done
          # 2) dann das Bundle als Ganzes
          codesign --force --deep --timestamp=none -s - "$app"
          # 3) prüfen – bricht ab, wenn die Signatur nicht zu den Ressourcen passt
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | head -12
          # 4) frisches DMG aus dem signierten Bundle (ein DMG bewahrt Rechte und Struktur – ein ZIP nicht immer)
          mkdir -p dist
          name="OFFLINE-$(echo '${{ matrix.name }}' | tr ' ' '-')"
          hdiutil create -volname OFFLINE -srcfolder "$app" -ov -format UDZO "dist/$name.dmg"
          # 5) Updater-Datei aus dem *signierten* Bundle (die von Tauri erzeugte enthält das unsignierte) und mit dem Updater-Schlüssel signieren
          if [ "${{ steps.updater.outputs.aktiv }}" = "ja" ]; then
            tgz="dist/OFFLINE-${{ matrix.plattform }}.app.tar.gz"
            tar czf "$tgz" -C "$(dirname "$app")" "$(basename "$app")"
            (cd app && npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "" "../$tgz")
            test -s "$tgz.sig"
          fi
          ls -la dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Installer als Artefakt (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: OFFLINE-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig
      - name: Installer als Artefakt (Windows/Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: OFFLINE-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/nsis/*.exe.sig
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            app/src-tauri/target/**/release/bundle/deb/*.deb

  # Bei Tags v* oder auf Knopfdruck („Run workflow“ → Veröffentlichen): Installer und Updater-Dateien nach Hetzner
  # (app/<version>/) und latest.json schreiben, damit installierte Apps die neue Version über „App-Update“ finden.
  # Die Version kommt aus app/src-tauri/tauri.conf.json.
  veroeffentlichen:
    name: Veröffentlichen (App-Update)
    if: startsWith(github.ref, 'refs/tags/v') || inputs.veroeffentlichen == true
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artefakte
      - name: latest.json bauen und hochladen
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          echo "Version $version"
          host="${ENDPOINT#https://}"
          basis="https://$BUCKET.$host/app/$version"
          find artefakte -type f | sort
          python3 - "$version" "$basis" <<'PY'
          import sys, json, glob, os, datetime, shutil
          version, basis = sys.argv[1], sys.argv[2]
          muster = {
            "darwin-aarch64": "artefakte/OFFLINE-macOS Apple Silicon/*.app.tar.gz",
            "darwin-x86_64":  "artefakte/OFFLINE-macOS Intel/*.app.tar.gz",
            "windows-x86_64": "artefakte/OFFLINE-Windows/**/nsis/*.exe",
            "linux-x86_64":   "artefakte/OFFLINE-Linux/**/appimage/*.AppImage",
          }
          os.makedirs("hochladen", exist_ok=True)
          plattformen = {}
          for key, m in muster.items():
            treffer = [f for f in glob.glob(m, recursive=True) if not f.endswith(".sig")]
            if not treffer or not os.path.exists(treffer[0] + ".sig"):
              print(f"::warning::{key}: keine Updater-Datei gefunden ({m})"); continue
            f = treffer[0]; name = os.path.basename(f)
            shutil.copy(f, "hochladen/" + name); shutil.copy(f + ".sig", "hochladen/" + name + ".sig")
            plattformen[key] = {"signature": open(f + ".sig").read().strip(), "url": f"{basis}/{name}"}
          # Installer für die Download-Seite daneben legen
          for f in glob.glob("artefakte/**/*", recursive=True):
            if os.path.isfile(f) and f.split(".")[-1] in ("dmg", "msi", "exe", "AppImage", "deb") and not os.path.exists("hochladen/" + os.path.basename(f)):
              shutil.copy(f, "hochladen/" + os.path.basename(f))
          if not plattformen:
            sys.exit("Keine Updater-Dateien – fehlt das Secret TAURI_SIGNING_PRIVATE_KEY?")
          latest = {"version": version, "notes": f"OFFLINE {version}", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": plattformen}
          json.dump(latest, open("latest.json", "w"), indent=2)
          print(json.dumps(latest, indent=2))
          PY
          aws --version || pip install awscli
          aws s3 sync hochladen "s3://$BUCKET/app/$version" --endpoint-url "$ENDPOINT" --acl public-read --no-progress
          aws s3 cp latest.json "s3://$BUCKET/app/latest.json" --endpoint-url "$ENDPOINT" --acl public-read --content-type application/json --cache-control no-cache
          echo "App-Update veröffentlicht: https://$BUCKET.$host/app/latest.json"
