# Tests bei jedem Push: Paketwerkzeug und Paket-Kit (Node), Kern (Rust), App-Berechtigungen auf drei Systemen. Keine Secrets, baut und veröffentlicht nichts.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  werkzeug:
    name: Werkzeug und Paket-Kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --test werkzeug/test.mjs
      - run: node --test web/bereit.test.mjs web/wesen.test.mjs web/tag.test.mjs web/neues.test.mjs web/pause.test.mjs web/stil.test.mjs web/buch.test.mjs
      - name: Paket-Kit gegen Beispiel und Vorlage
        run: |
          node paket-kit/pruefen.mjs paket-kit/beispiel/wichteln --kein-bericht
          # Die Vorlage ist absichtlich leer: Sie muss Fehler melden, darf aber nicht abstürzen.
          set +e; node paket-kit/pruefen.mjs paket-kit/vorlage --kein-bericht > /dev/null; code=$?; set -e
          [ "$code" = "1" ] || { echo "Vorlage: erwartet Exit 1 (Fehler gemeldet), bekommen $code"; exit 1; }

  kern:
    name: Kern (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path kern/Cargo.toml

  sandbox:
    name: Modul-Sandbox (Headless-Chrome gegen das bösartige Testmodul)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path kern/Cargo.toml --bin offline-kern
      # Google Chrome ist auf den Ubuntu-Runnern vorinstalliert
      - run: node werkzeug/sandbox-probe.mjs --chrome
        env: { CHROME: google-chrome }

  app-berechtigungen:
    name: App-Berechtigungen (${{ matrix.os }})
    # Dritte Sicherung für Module (SICHERHEIT.md): Tauri-Befehle nur im App-Fenster, der Modulserver bekommt keinen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Platzhalter für kiwix-serve (wird im Test nicht gestartet)
        shell: bash
        run: |
          t=$(rustc -vV | sed -n 's/^host: //p'); e=""; [ "$RUNNER_OS" = Windows ] && e=.exe
          mkdir -p app/src-tauri/binaries && touch "app/src-tauri/binaries/kiwix-serve-$t$e"
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml berechtigungen

