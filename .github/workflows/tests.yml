# Tests bei jedem Push: Paketwerkzeug und Paket-Kit (Node), Kern (Rust), App-Berechtigungen auf drei Systemen. Baut und veröffentlicht nichts.
# Einziges Secret: der Kanal-Schlüssel, damit die Inhaltstests auch Unveröffentlichtes prüfen (liegt im Repo nur verschlüsselt,
# Auftrag 2026-10-06-13). Der Klartext bleibt im Runner und kommt in kein Log. Ohne Secret (Pull-Request von außen) werden sie übersprungen.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  werkzeug:
    name: Werkzeug und Paket-Kit
    runs-on: ubuntu-latest
    steps:
      # Mit Tags: Die Klartext-Wache nimmt den Stand der letzten veröffentlichten App-Version (vX.Y.Z) als öffentlich
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Unveröffentlichtes entschlüsseln (nur für die Tests)
        env:
          OFFLINE_INTERN_SCHLUESSEL: ${{ secrets.OFFLINE_INTERN_SCHLUESSEL }}
        run: |
          set -euo pipefail
          [ -n "$OFFLINE_INTERN_SCHLUESSEL" ] || { echo "Kein Kanal-Schlüssel: Inhaltstests werden übersprungen"; exit 0; }
          find . -type d -name verschluesselt -not -path "./node_modules/*" | while read -r v; do node werkzeug/intern.mjs entschluesseln "$v" "$(dirname "$v")" > /dev/null; done
      - run: node --test werkzeug/test.mjs werkzeug/klartext-wache.test.mjs werkzeug/probe-katalog.test.mjs werkzeug/bildvergleich.test.mjs
      - run: node --test web/bereit.test.mjs web/wesen.test.mjs web/tag.test.mjs web/neues.test.mjs web/pause.test.mjs web/stil.test.mjs web/buch.test.mjs web/neuigkeiten.test.mjs web/meintag.test.mjs web/intern.test.mjs web/naturheilkunde.test.mjs web/naturbilder.test.mjs web/gedanken.test.mjs web/abkuerzungen.test.mjs web/spiele.test.mjs web/lumi-seite.test.mjs web/pause-inhalte.test.mjs web/startreife.test.mjs web/szenarien.test.mjs web/anker.test.mjs web/bibliothek-bald.test.mjs web/impressum.test.mjs web/heilkunde.test.mjs web/netz.test.mjs web/suche.test.mjs web/polster.test.mjs web/haushalt.test.mjs web/vorrat.test.mjs
      - name: Paket-Kit gegen Beispiel und Vorlage
        run: |
          node paket-kit/pruefen.mjs paket-kit/beispiel/wichteln --kein-bericht
          # Die Vorlage ist absichtlich leer: Sie muss Fehler melden, darf aber nicht abstürzen.
          set +e; node paket-kit/pruefen.mjs paket-kit/vorlage --kein-bericht > /dev/null; code=$?; set -e
          [ "$code" = "1" ] || { echo "Vorlage: erwartet Exit 1 (Fehler gemeldet), bekommen $code"; exit 1; }

  kern:
    name: Kern (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path kern/Cargo.toml

  sandbox:
    name: Modul-Sandbox (Headless-Chrome gegen das bösartige Testmodul)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path kern/Cargo.toml --bin offline-kern
      # Google Chrome ist auf den Ubuntu-Runnern vorinstalliert
      - run: node werkzeug/sandbox-probe.mjs --chrome
        env: { CHROME: google-chrome }
      # Spielpaket 1: zwei Geräte, dasselbe Rätsel des Tages; ohne WebAssembly-Freigabe startet keins
      - run: node werkzeug/spiele-probe.mjs --chrome
        env: { CHROME: google-chrome }

  bild-und-barrierefreiheit:
    name: Bildvergleich und Barrierefreiheit (Web-App, Headless-Chrome)
    # Auftrag Nr. 21: MVP-Seiten in 360 und 1280 px, hell und dunkel, gegen werkzeug/referenz/ und mit axe-core (WCAG 2.1 AA).
    # Die Referenz wird hier nie gesetzt (nur von Hand mit --referenz-setzen); bei Abweichung Aufnahmen und Differenzbilder als Artefakt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # Nr. 32: der Update-Test braucht den Tag der vorigen Version
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Lumi im MVP nur als Vorschau (Nr. 27), Länderfrage und Heute ohne Überlauf (Nr. 28)
        run: node --test werkzeug/lumi-vorschau.test.mjs werkzeug/land.test.mjs werkzeug/heute-breite.test.mjs werkzeug/heute-neu.test.mjs werkzeug/suche.test.mjs werkzeug/ueber.test.mjs
        env: { CHROME: google-chrome }
      - name: Roman der Woche auf Spiele, Update von der vorigen Version (Nr. 32), Euer Polster (Nr. 34)
        run: node --test werkzeug/roman-spiele.test.mjs werkzeug/polster.test.mjs
        env: { CHROME: google-chrome }
      - name: Unveröffentlichtes entschlüsseln (nur für die Tests)
        env:
          OFFLINE_INTERN_SCHLUESSEL: ${{ secrets.OFFLINE_INTERN_SCHLUESSEL }}
        run: |
          set -euo pipefail
          [ -n "$OFFLINE_INTERN_SCHLUESSEL" ] || { echo "Kein Kanal-Schlüssel: Inhaltstests werden übersprungen"; exit 0; }
          find . -type d -name verschluesselt -not -path "./node_modules/*" | while read -r v; do node werkzeug/intern.mjs entschluesseln "$v" "$(dirname "$v")" > /dev/null; done
      - name: Karten zu Akku und Strom (Nr. 36, unveröffentlicht; ohne Kanal-Schlüssel übersprungen)
        run: node --test werkzeug/akku.test.mjs
        env: { CHROME: google-chrome }
      - name: Blatt bleibt beim Neuzeichnen offen (Nr. 26), Rundgang-Prüfung Schweiz (Nr. 37), Sirenen anhören (Nr. 38)
        run: node --test werkzeug/blatt.test.mjs werkzeug/rundgang-schweiz.test.mjs werkzeug/sirenen.test.mjs werkzeug/bereit-erklaert.test.mjs werkzeug/haushalt.test.mjs werkzeug/menue.test.mjs werkzeug/vorrat.test.mjs werkzeug/einkauf.test.mjs
        env: { CHROME: google-chrome }
      - name: Bildvergleich
        run: node werkzeug/bildvergleich.mjs --chrome --aus bildvergleich-aus --anker bildvergleich-aus/anker
        env: { CHROME: google-chrome }
      - name: Barrierefreiheit
        if: success() || failure()
        run: node werkzeug/barrierefrei.mjs --chrome --aus barrierefrei-aus
        env: { CHROME: google-chrome }
      - name: Aufnahmen und Differenzbilder
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: bildvergleich-${{ github.sha }}
          path: |
            bildvergleich-aus/
            barrierefrei-aus/
          retention-days: 14

  app-berechtigungen:
    name: App-Berechtigungen (${{ matrix.os }})
    # Dritte Sicherung für Module (SICHERHEIT.md): Tauri-Befehle nur im App-Fenster, der Modulserver bekommt keinen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Platzhalter für kiwix-serve (wird im Test nicht gestartet)
        shell: bash
        run: |
          t=$(rustc -vV | sed -n 's/^host: //p'); e=""; [ "$RUNNER_OS" = Windows ] && e=.exe
          mkdir -p app/src-tauri/binaries && touch "app/src-tauri/binaries/kiwix-serve-$t$e"
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml berechtigungen
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml tresor_sperren
      # Store-Build (0.7.2): ohne Updater und internen Kanal muss es bauen; mit Updater zusammen darf es nicht
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml --no-default-features --features store

