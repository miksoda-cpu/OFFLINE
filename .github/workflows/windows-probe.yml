# Windows-Probe vor einem Release: die echte App unter WebView2, bedient über WebDriver (msedgedriver).
#   1. Sandbox-Probe gegen Edge (dieselbe Prüfseite wie in tests.yml, Chromium-Engine von Windows)
#   2. Update-Test: 0.1.8 (aus dem Quellstand, Commit 2deada3) installieren, mit Daten füllen, die neue Version darüber
#      installieren – einmal mit benanntem Wesen, einmal ohne Namen. Bereit darf nicht fallen, Daten bleiben.
#   3. In der neuen App: Sandbox-Probe mit dem bösartigen Testmodul, Wichteln aus redaktion/freigegeben laden, spielen,
#      inaktiv, löschen.
#   4. (Nr. 25) Die alte App 0.1.8 läuft gegen einen eingefrorenen, signierten Katalog (werkzeug/probe-katalog, siehe
#      werkzeug/README.md), die neue gegen den Live-Katalog. Dazu der Weg 0.8.0 (Tag v0.8.0) → neu, mit und ohne Namen.
# Beide Test-Builds sind Entwickler-Builds mit Debug-Anschluss (Port 9222, nur für diese Probe; Tauri setzt eigene
# WebView2-Argumente, deshalb greift die Umgebungsvariable von tauri-driver nicht). Der Treiber hängt sich an die laufende
# App. Signiert nichts, veröffentlicht nichts.
name: Windows-Probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Windows (WebView2)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            kern
            app/src-tauri
            alt/app/src-tauri
            alt08/app/src-tauri

      - name: Sandbox-Probe gegen Edge
        shell: bash
        run: |
          cargo build --manifest-path kern/Cargo.toml --bin offline-kern
          CHROME="C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" node werkzeug/sandbox-probe.mjs --chrome

      - name: Spiele-Probe gegen Edge (Tagesrätsel, WebAssembly in der Sandbox)
        shell: bash
        run: CHROME="C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" node werkzeug/spiele-probe.mjs --chrome

      - name: Quellstände 0.1.8 und 0.8.0 daneben legen
        shell: bash
        # Der Cache legt <ordner>/app/src-tauri/target schon an; beiseitelegen, Quellstand holen, zurücklegen
        run: |
          set -euo pipefail
          for paar in "alt 2deada3" "alt08 v0.8.0"; do
            set -- $paar
            [ -d $1/app/src-tauri/target ] && mv $1/app/src-tauri/target $1-target || true
            rm -rf $1
            git worktree add $1 $2
            [ -d $1-target ] && mv $1-target $1/app/src-tauri/target || true
          done

      - name: kiwix-serve als mitgeliefertes Programm holen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kiwix && cd kiwix
          holen() { curl -fsSL --ssl-no-revoke --retry 3 --retry-delay 10 --retry-all-errors -o paket "$1"; }
          holen https://download.kiwix.org/release/kiwix-tools/kiwix-tools_win-x86_64.zip || holen https://download.kiwix.org/release/kiwix-tools/kiwix-tools_win-i686.zip
          unzip -q paket
          for z in ../app ../alt/app ../alt08/app; do mkdir -p $z/src-tauri/binaries; cp "$(find . -type f -name kiwix-serve.exe | head -1)" $z/src-tauri/binaries/kiwix-serve-x86_64-pc-windows-msvc.exe; done

      - name: Test-Builds alt (0.1.8), 0.8.0 und neu, mit Debug-Anschluss (NSIS)
        shell: bash
        run: |
          set -euo pipefail
          for z in alt/app alt08/app app; do
            node -e '
              const fs = require("fs"); const c = JSON.parse(fs.readFileSync(process.argv[1] + "/src-tauri/tauri.conf.json", "utf8"));
              const w = c.app.windows.map((f) => ({ ...f, additionalBrowserArgs: "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222" }));
              fs.writeFileSync(process.argv[1] + "/probe.json", JSON.stringify({ app: { windows: w }, bundle: { createUpdaterArtifacts: false } }));
            ' "$z"
            (cd "$z" && npm install && npx tauri build --debug --bundles nsis --config probe.json)
          done
          ls alt/app/src-tauri/target/debug/bundle/nsis/ alt08/app/src-tauri/target/debug/bundle/nsis/ app/src-tauri/target/debug/bundle/nsis/

      - name: Passender msedgedriver
        shell: pwsh
        run: |
          $v = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv
          Write-Host "WebView2 $v"
          New-Item -ItemType Directory -Force treiber | Out-Null
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile treiber\edge.zip
            Expand-Archive treiber\edge.zip -DestinationPath treiber -Force
          } catch {
            Write-Host "Download fehlgeschlagen, nehme den msedgedriver des Runners ($env:EdgeWebDriver)"
            Copy-Item "$env:EdgeWebDriver\msedgedriver.exe" treiber\
          }
          & treiber\msedgedriver.exe --version

      - name: Update-Test und Module
        shell: bash
        env:
          WEBDRIVER_URL: http://127.0.0.1:9515
          PROBE_DEBUGGER: 127.0.0.1:9222
        run: |
          set +e -uo pipefail   # einzelne Schritte dürfen scheitern, gezählt wird in $fehler
          mkdir -p probe
          # msedgedriver im selben Schritt: Windows-Runner beenden Hintergrundprozesse am Ende eines Schritts
          treiber/msedgedriver.exe --port=9515 > treiber/msedgedriver.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:9515/status >/dev/null && break; sleep 1; done
          alt=$(ls alt/app/src-tauri/target/debug/bundle/nsis/*-setup.exe | head -1)
          alt08=$(ls alt08/app/src-tauri/target/debug/bundle/nsis/*-setup.exe | head -1)
          neu=$(ls app/src-tauri/target/debug/bundle/nsis/*-setup.exe | head -1)
          echo "alt: $alt"; echo "alt08: $alt08"; echo "neu: $neu"
          # Eingefrorener Katalog für 0.1.8 (Nr. 25): lokal ausgeliefert; die neue App bekommt wieder den Live-Katalog
          python -m http.server 8898 --bind 127.0.0.1 --directory werkzeug/probe-katalog > probe/katalog-server.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8898/katalog.json >/dev/null && break; sleep 1; done
          daten="$APPDATA/at.digioneer.offline"
          katalog() { # Katalog-Adresse in abo.json setzen, alles andere bleibt
            mkdir -p "$daten"
            node -e '
              const fs = require("fs"), f = process.argv[1]; let a = {};
              try { a = JSON.parse(fs.readFileSync(f, "utf8")); } catch {}
              a.einstellungen = { aktiv: true, intervall: "woechentlich", nur_wlan: true, fenster: true, von: "02:00", bis: "05:00", ...(a.einstellungen ?? {}), katalog_url: process.argv[2] };
              a.zustand ??= { letzte_pruefung: null, katalog_erstellt: null, letzter_fehler: null }; a.speicherort ??= null;
              fs.writeFileSync(f, JSON.stringify(a));
            ' "$daten/abo.json" "$1"
          }
          eingefroren="http://127.0.0.1:8898/katalog.json"
          live="https://offline-pakete.fsn1.your-objectstorage.com/katalog/katalog.json"
          pakete="$(cygpath -w "$PWD/werkzeug/probe-katalog/pakete")"
          # 0.8.0 bekommt das Österreich-Paket so, wie es heutige Nutzer von 0.8.0 haben: at-basis 2026.10.16 (app_min 0.8.0),
          # echt signiert und eingefroren. Seit at-basis 2026.10.19 verlangt das Paket im Live-Katalog app_min 0.9.5 (Nr. 44).
          pakete08="$(cygpath -w "$PWD/werkzeug/probe-katalog-08/pakete")"
          ziel="$LOCALAPPDATA/OFFLINE"
          installieren() { taskkill //F //IM offline-app.exe >/dev/null 2>&1 || true; sleep 2; "$1" //S; sleep 5; }
          exe() { find "$ziel" -maxdepth 1 -name "*.exe" ! -iname "uninstall*" ! -iname "kiwix*" | head -1; }
          aufraeumen() {
            taskkill //F //IM offline-app.exe >/dev/null 2>&1 || true; sleep 2
            [ -x "$ziel/uninstall.exe" ] && "$ziel/uninstall.exe" //S; sleep 5
            rm -rf "$ziel" "$LOCALAPPDATA/at.digioneer.offline" "$APPDATA/at.digioneer.offline"
          }
          fehler=0
          # Nach einem Update genau ein Eintrag „OFFLINE“ unter den installierten Apps (Nr. 25, Hersteller-Feld aus Nr. 22):
          # Der Eintrag hängt am Hersteller; ändert sich der, darf kein verwaister Eintrag der alten Version bleiben.
          eintraege() {
            local n
            n=$(reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall' //s //v DisplayName 2>/dev/null | grep -cE 'REG_SZ[[:space:]]+OFFLINE[[:space:]]*$' || true)
            reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall' //s //f OFFLINE 2>/dev/null | grep -E 'HKEY|DisplayName|DisplayVersion|Publisher' || true
            if [ "$n" = "1" ]; then echo "  ✓ Ein Eintrag unter den installierten Apps ($1)"; else echo "  ✗ $n Einträge unter den installierten Apps ($1)"; fehler=1; fi
          }
          # A: benanntes Wesen
          katalog "$eingefroren"
          installieren "$alt"
          node werkzeug/app-probe.mjs alt --app "$(cygpath -w "$(exe)")" --name Betty --pakete "$pakete" --aus probe/a-alt.json || fehler=1
          installieren "$neu"   # schließt die alte App vorher
          katalog "$live"
          node werkzeug/app-probe.mjs neu --app "$(cygpath -w "$(exe)")" --vorher probe/a-alt.json --aus probe/a-neu.json || fehler=1
          eintraege "Fall A"
          # Module in der neuen App
          node werkzeug/app-probe.mjs module --app "$(cygpath -w "$(exe)")" --boese "$(cygpath -w "$PWD/werkzeug/testmodule/boese")" --quelle "$(cygpath -w "$PWD/redaktion/freigegeben")" --aus probe/module.json || fehler=1
          # B: Wesen ohne Namen, frisches Gerät
          aufraeumen
          katalog "$eingefroren"
          installieren "$alt"
          node werkzeug/app-probe.mjs alt --app "$(cygpath -w "$(exe)")" --pakete "$pakete" --aus probe/b-alt.json || fehler=1
          installieren "$neu"   # schließt die alte App vorher
          katalog "$live"
          node werkzeug/app-probe.mjs neu --app "$(cygpath -w "$(exe)")" --vorher probe/b-alt.json --aus probe/b-neu.json || fehler=1
          # C: frische Installation der neuen Version, ohne Vorgänger
          aufraeumen
          installieren "$neu"
          node werkzeug/app-probe.mjs module --app "$(cygpath -w "$(exe)")" --boese "$(cygpath -w "$PWD/werkzeug/testmodule/boese")" --quelle "$(cygpath -w "$PWD/redaktion/freigegeben")" --frisch --aus probe/c-frisch.json || fehler=1
          # D und E (Nr. 25): der Weg heutiger Nutzer, 0.8.0 → neu; die neue App gegen den Live-Katalog; mit und ohne Namen
          aufraeumen
          installieren "$alt08"
          node werkzeug/app-probe.mjs alt --stand 0.8 --app "$(cygpath -w "$(exe)")" --name Betty --pakete "$pakete08" --aus probe/d-alt08.json || fehler=1
          installieren "$neu"
          node werkzeug/app-probe.mjs neu --app "$(cygpath -w "$(exe)")" --vorher probe/d-alt08.json --aus probe/d-neu.json || fehler=1
          eintraege "Fall D"
          aufraeumen
          installieren "$alt08"
          node werkzeug/app-probe.mjs alt --stand 0.8 --app "$(cygpath -w "$(exe)")" --pakete "$pakete08" --aus probe/e-alt08.json || fehler=1
          installieren "$neu"
          node werkzeug/app-probe.mjs neu --app "$(cygpath -w "$(exe)")" --vorher probe/e-alt08.json --aus probe/e-neu.json || fehler=1
          exit $fehler

      - name: Berichte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-probe
          path: |
            probe/*.json
            werkzeug/testmodule/bericht-edge.json
            treiber/*.log
