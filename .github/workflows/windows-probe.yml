# Windows-Probe vor einem Release: die echte App unter WebView2, bedient über WebDriver (tauri-driver + msedgedriver).
#   1. Sandbox-Probe gegen Edge (dieselbe Prüfseite wie in tests.yml, Chromium-Engine von Windows)
#   2. Update-Test: 0.1.8 von Hetzner installieren, mit Daten füllen, die neue Version darüber installieren
#      (einmal mit benanntem Wesen, einmal ohne Namen). Bereit darf nicht fallen, Daten bleiben.
#   3. In der neuen App: Sandbox-Probe mit dem bösartigen Testmodul, Wichteln aus redaktion/freigegeben laden, spielen,
#      inaktiv, löschen.
# Baut einen Entwickler-Build (Sandbox-Probe gibt es nur dort), signiert nichts, veröffentlicht nichts.
name: Windows-Probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Windows (WebView2)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            kern
            app/src-tauri

      - name: Sandbox-Probe gegen Edge
        shell: bash
        run: |
          cargo build --manifest-path kern/Cargo.toml --bin offline-kern
          CHROME="C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" node werkzeug/sandbox-probe.mjs --chrome

      - name: kiwix-serve als mitgeliefertes Programm holen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src-tauri/binaries kiwix && cd kiwix
          holen() { curl -fsSL --ssl-no-revoke --retry 3 --retry-delay 10 --retry-all-errors -o paket "$1"; }
          holen https://download.kiwix.org/release/kiwix-tools/kiwix-tools_win-x86_64.zip || holen https://download.kiwix.org/release/kiwix-tools/kiwix-tools_win-i686.zip
          unzip -q paket
          cp "$(find . -type f -name kiwix-serve.exe | head -1)" ../app/src-tauri/binaries/kiwix-serve-x86_64-pc-windows-msvc.exe

      - name: Entwickler-Build der neuen Version (NSIS)
        shell: bash
        working-directory: app
        run: |
          npm install
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > probe.json
          npx tauri build --debug --bundles nsis --config probe.json
          ls src-tauri/target/debug/bundle/nsis/

      - name: tauri-driver und passender msedgedriver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          $v = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv
          Write-Host "WebView2 $v"
          New-Item -ItemType Directory -Force treiber | Out-Null
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile treiber\edge.zip
            Expand-Archive treiber\edge.zip -DestinationPath treiber -Force
          } catch {
            Write-Host "Download fehlgeschlagen, nehme den msedgedriver des Runners ($env:EdgeWebDriver)"
            Copy-Item "$env:EdgeWebDriver\msedgedriver.exe" treiber\
          }
          & treiber\msedgedriver.exe --version
          Start-Process -FilePath "$env:USERPROFILE\.cargo\bin\tauri-driver.exe" -ArgumentList "--native-driver", "$pwd\treiber\msedgedriver.exe" -RedirectStandardOutput treiber\tauri-driver.log -RedirectStandardError treiber\tauri-driver.err
          Start-Sleep 3

      - name: Update-Test und Module
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe
          neu=$(ls app/src-tauri/target/debug/bundle/nsis/*-setup.exe | head -1)
          curl -fsSL --ssl-no-revoke -o probe/alt-setup.exe https://offline-pakete.fsn1.your-objectstorage.com/app/0.1.8/OFFLINE_0.1.8_x64-setup.exe
          ziel="$LOCALAPPDATA/OFFLINE"
          installieren() { taskkill //F //IM offline-app.exe >/dev/null 2>&1; sleep 2; "$1" //S; sleep 5; }
          exe() { find "$ziel" -maxdepth 1 -name "*.exe" ! -iname "uninstall*" ! -iname "kiwix*" | head -1; }
          aufraeumen() {
            taskkill //F //IM offline-app.exe >/dev/null 2>&1; sleep 2
            [ -x "$ziel/uninstall.exe" ] && "$ziel/uninstall.exe" //S; sleep 5
            rm -rf "$ziel" "$LOCALAPPDATA/at.digioneer.offline" "$APPDATA/at.digioneer.offline"
          }
          fehler=0
          # A: benanntes Wesen
          installieren probe/alt-setup.exe
          node werkzeug/app-probe.mjs alt --app "$(cygpath -w "$(exe)")" --name Betty --aus probe/a-alt.json || fehler=1
          installieren "$neu"
          node werkzeug/app-probe.mjs neu --app "$(cygpath -w "$(exe)")" --vorher probe/a-alt.json --aus probe/a-neu.json || fehler=1
          # Module in der neuen App (Entwickler-Build)
          node werkzeug/app-probe.mjs module --app "$(cygpath -w "$(exe)")" --boese "$(cygpath -w "$PWD/werkzeug/testmodule/boese")" --quelle "$(cygpath -w "$PWD/redaktion/freigegeben")" --aus probe/module.json || fehler=1
          # B: Wesen ohne Namen, frisches Gerät
          aufraeumen
          installieren probe/alt-setup.exe
          node werkzeug/app-probe.mjs alt --app "$(cygpath -w "$(exe)")" --aus probe/b-alt.json || fehler=1
          installieren "$neu"
          node werkzeug/app-probe.mjs neu --app "$(cygpath -w "$(exe)")" --vorher probe/b-alt.json --aus probe/b-neu.json || fehler=1
          exit $fehler

      - name: Berichte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-probe
          path: |
            probe/*.json
            werkzeug/testmodule/bericht-*.json
            treiber/*.log
            treiber/*.err
