[package]
name = "offline-kern"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"

[lib]
name = "offline_kern"
path = "src/lib.rs"

[[bin]]
name = "offline-kern"
path = "src/main.rs"
