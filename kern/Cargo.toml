[package]
name = "offline-kern"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hex = "0.4.3"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["gzip"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[features]
# TLS (rustls) ist Standard. Nur für reine Typprüfungen auf Zielen ohne C-Compiler abschaltbar (--no-default-features).
default = ["tls"]
tls = ["ureq/tls"]

[lib]
name = "offline_kern"
path = "src/lib.rs"

[[bin]]
name = "offline-kern"
path = "src/main.rs"

[dev-dependencies]
ed25519-dalek = "2"
